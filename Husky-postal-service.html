<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Husky Postal Service</title>
<style>
  :root { color-scheme: dark; --ink:#f4f8ff; --panel:rgba(20,30,50,.88); --accent:#ffd166; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: dark; } }
  html,body { margin:0; height:100%; background:#0b1322; font-family: "Trebuchet MS", system-ui, sans-serif; color:var(--ink); overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:10px; left:10px; right:10px; display:flex; gap:10px; flex-wrap:wrap; pointer-events:none; }
  .chip { background:var(--panel); padding:6px 12px; border-radius:14px; font-size:14px; box-shadow:0 2px 8px #0006; }
  #shop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#0008; }
  #shop .card { background:var(--panel); padding:22px 26px; border-radius:18px; min-width:300px; box-shadow:0 8px 30px #000a; }
  #shop h2 { margin:0 0 10px; color:var(--accent); }
  #shop p.item { margin:8px 0; font-size:15px; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel); padding:10px 18px; border-radius:14px; display:none; max-width:80vw; text-align:center; font-size:16px; }
  #help { position:fixed; bottom:10px; left:10px; font-size:12px; opacity:.75; pointer-events:none; }
  canvas { touch-action:none; }
  #shop { z-index:6; }
  #shop .card { position:relative; }
  .xbtn { position:absolute; top:8px; right:8px; width:40px; height:40px; border-radius:50%; border:none; background:#fff2; color:#fff; font:bold 20px sans-serif; cursor:pointer; touch-action:manipulation; }
  .xbtn:hover { background:#fff4; }
  #touch { display:none; position:fixed; inset:0; pointer-events:none; z-index:5; }
  @media (pointer:coarse) { #touch { display:block; } #help { display:none; } }
  #stick { position:absolute; left:24px; bottom:24px; width:130px; height:130px; border-radius:50%; background:#fff2; border:2px solid #fff5; pointer-events:auto; touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:#ffd166cc; }
  .tbtn { position:absolute; width:76px; height:76px; border-radius:50%; background:#fff3; border:2px solid #fff6; color:#fff; font:bold 18px sans-serif; pointer-events:auto; touch-action:none; -webkit-user-select:none; user-select:none; }
  #btnA { right:28px; bottom:40px; }
  #btnS { right:118px; bottom:40px; font-size:14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="chip" id="money">Biscuits: 0</div>
  <div class="chip" id="carry">Packages: 0/3</div>
  <div class="chip" id="target">Target: —</div>
  <div class="chip" id="weather">Weather: Clear</div>
</div>
<div id="toast"></div>
<div id="help">Arrows/WASD: run · SPACE: grab packages at Post Office / zoomies · U: sled shop · Walk into a mailbox to deliver</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="btnA">GO</button>
  <button class="tbtn" id="btnS">SHOP</button>
</div>
<div id="shop"><div class="card"><button id="closeShop" class="xbtn" aria-label="Close shop">✕</button><h2>Sled Shop</h2><div id="shopItems"></div><p style="font-size:13px;opacity:.8">Press 1–5 to buy · U or ESC to close</p></div></div>

<script>
(() => {
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let VW = 0, VH = 0;
function resize(){ VW = cvs.width = innerWidth; VH = cvs.height = innerHeight; }
addEventListener('resize', resize); resize();

const WORLD = { w: 2400, h: 1600 };
const PO = { x: 1200, y: 800, w: 160, h: 120 };

// ---------- deterministic RNG ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- world generation ----------
const NAMES = ["Mrs. Waddleton","Captain Biscuit","Dr. Fluffington","The Tuba Family","Old Man Nibbles","Pip & Margo","Sir Reginald Snoot","Gerald the Plumber","Aunt Mittens","Chef Crumb"];
const QUOTES = ["Bless your fluffy heart!","I was just thinking about a parcel!","Is that a sled or a pastry?","Five paws, would be delivered to again.","Tell the pigeons to stop.","I ordered a meteorite. This is fine."];
const COLORS = ["#e76f51","#2a9d8f","#e9c46a","#8ab17d","#b388eb","#f4a261","#48cae4"];
const houses = [];
for (let gx = 0; gx < 7; gx++) for (let gy = 0; gy < 5; gy++) {
  const x = 120 + gx * 320 + (rnd()*40|0), y = 120 + gy * 290 + (rnd()*30|0);
  if (Math.abs(x + 80 - PO.x) < 260 && Math.abs(y + 60 - PO.y) < 200) continue;
  if (rnd() < 0.15) continue;
  houses.push({ x, y, w: 130 + (rnd()*40|0), h: 100 + (rnd()*30|0), color: COLORS[(rnd()*COLORS.length)|0],
    name: NAMES[(rnd()*NAMES.length)|0], door: null });
}
houses.forEach(h => h.door = { x: h.x + h.w/2, y: h.y + h.h + 10 });
const trees = [];
for (let i = 0; i < 120; i++) trees.push({ x: rnd()*WORLD.w, y: rnd()*WORLD.h, r: 14 + rnd()*14 });
const pigeons = [];
for (let i = 0; i < 12; i++) pigeons.push({ x: rnd()*WORLD.w, y: rnd()*WORLD.h, a: rnd()*6, t: 0 });
const cats = [];
for (let i = 0; i < 8; i++) cats.push({ x: rnd()*WORLD.w, y: rnd()*WORLD.h, dir: rnd()*6, t: 0 });
const solids = houses.map(h => ({ x: h.x, y: h.y, w: h.w, h: h.h }));
solids.push({ x: PO.x - PO.w/2, y: PO.y - PO.h/2, w: PO.w, h: PO.h });

// ---------- upgrades ----------
const UPGRADES = [
  { key: "speed",  name: "Zoomies Turbo", cost: 30,  desc: "+ running speed", lvl: 0, max: 4 },
  { key: "grip",   name: "Paw Grip Spikes", cost: 25, desc: "+ traction on ice", lvl: 0, max: 4 },
  { key: "bounce", name: "Trampoline Sled", cost: 40, desc: "+ bouncy collisions", lvl: 0, max: 4 },
  { key: "fluff",  name: "Extra Fluff Coat", cost: 35, desc: "- weather slowdown", lvl: 0, max: 4 },
  { key: "cargo",  name: "Bigger Sack", cost: 50, desc: "+1 package capacity", lvl: 0, max: 3 },
];
const up = k => UPGRADES.find(u => u.key === k).lvl;

// ---------- weather ----------
const WEATHERS = [
  { name: "Clear", dur: 22, fric: 0.965, wind: 0, snow: 40, fog: 0, rain: 0 },
  { name: "Snow", dur: 18, fric: 0.975, wind: 0.02, snow: 160, fog: 0.1, rain: 0 },
  { name: "Blizzard Lite", dur: 14, fric: 0.97, wind: 0.09, snow: 300, fog: 0.45, rain: 0 },
  { name: "Drizzle", dur: 18, fric: 0.99, wind: 0.01, snow: 0, fog: 0.15, rain: 120 },
  { name: "Gust Festival", dur: 12, fric: 0.96, wind: 0.14, snow: 60, fog: 0, rain: 0 },
];
let wIdx = 0, wTimer = WEATHERS[0].dur, windT = 0;
let wind = { x: 0, y: 0 };

// ---------- player ----------
const P = { x: PO.x, y: PO.y + 90, vx: 0, vy: 0, r: 13, ang: 0, zoom: 0, carry: 0, cargoFlash: 0 };
let money = 0, target = null, bursts = [], flakes = [], toastT = 0, shopOpen = false;
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyU' || e.code === 'Escape') { shopOpen = e.code === 'KeyU' ? !shopOpen : false; document.getElementById('shop').style.display = shopOpen ? 'flex' : 'none'; renderShop(); }
  if (shopOpen && /^Digit[1-5]$/.test(e.code)) buy(+e.code.slice(-1) - 1);
  if (e.code === 'Space') { e.preventDefault(); onSpace(); }
});
addEventListener('keyup', e => keys[e.code] = false);

// ---------- touch controls ----------
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null, sx = 0, sy = 0; const STICK_R = 50;
function setDir(dx, dy){ keys.ArrowLeft = dx < -0.3; keys.ArrowRight = dx > 0.3; keys.ArrowUp = dy < -0.3; keys.ArrowDown = dy > 0.3; }
function moveKnob(x, y){
  const dx = x - sx, dy = y - sy, d = Math.hypot(dx, dy), m = Math.min(d, STICK_R);
  const ux = d ? dx / d : 0, uy = d ? dy / d : 0;
  knob.style.transform = `translate(${ux*m}px, ${uy*m}px)`;
  setDir(dx / STICK_R, dy / STICK_R);
}
stick.addEventListener('touchstart', e => {
  e.preventDefault(); const t = e.changedTouches[0]; stickId = t.identifier;
  const r = stick.getBoundingClientRect(); sx = r.left + r.width/2; sy = r.top + r.height/2;
  moveKnob(t.clientX, t.clientY);
}, { passive: false });
stick.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === stickId) moveKnob(t.clientX, t.clientY);
}, { passive: false });
const endStick = e => {
  for (const t of e.changedTouches) if (t.identifier === stickId) { stickId = null; knob.style.transform = 'translate(0,0)'; setDir(0, 0); }
};
stick.addEventListener('touchend', endStick);
stick.addEventListener('touchcancel', endStick);
function toggleShop(){
  shopOpen = !shopOpen;
  document.getElementById('shop').style.display = shopOpen ? 'flex' : 'none';
  renderShop();
}
const btnA = document.getElementById('btnA'), btnS = document.getElementById('btnS');
btnA.addEventListener('touchstart', e => { e.preventDefault(); onSpace(); }, { passive: false });
btnS.addEventListener('touchstart', e => { e.preventDefault(); toggleShop(); }, { passive: false });
document.getElementById('shopItems').addEventListener('click', e => {
  const items = [...document.querySelectorAll('#shopItems p.item')];
  const i = items.indexOf(e.target.closest('p.item'));
  if (i >= 0) buy(i);
});

const closeBtn = document.getElementById('closeShop');
const closeShopHandler = e => { e.preventDefault(); if (shopOpen) toggleShop(); };
closeBtn.addEventListener('click', closeShopHandler);
closeBtn.addEventListener('touchend', closeShopHandler, { passive: false });

function toast(msg, ms = 2600){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; toastT = ms; }
function renderShop(){
  document.getElementById('shopItems').innerHTML = UPGRADES.map((u,i) => {
    const cost = u.cost * (u.lvl + 1);
    const maxed = u.lvl >= u.max;
    return `<p class="item">${i+1}. <b>${u.name}</b> (lvl ${u.lvl}/${u.max}) — ${u.desc}<br>${maxed ? "MAXED" : "Cost: " + cost + " biscuits"}</p>`;
  }).join('');
}
function buy(i){
  const u = UPGRADES[i]; if (!u || u.lvl >= u.max) return;
  const cost = u.cost * (u.lvl + 1);
  if (money < cost) return toast("Not enough biscuits! Deliver more parcels.");
  money -= cost; u.lvl++; toast(`Bought ${u.name}!`); renderShop();
}
function onSpace(){
  const dPO = Math.hypot(P.x - PO.x, P.y - PO.y);
  const cap = 3 + up("cargo");
  if (dPO < 110 && P.carry < cap) {
    P.carry = cap; toast("Grabbed a full sack of parcels. The sack wiggles happily."); return;
  }
  P.zoom = 1.5; burst(P.x, P.y, "ZOOMIES!", "#ffd166");
}
function burst(x,y,txt,col){ bursts.push({x,y,txt,col,t:1.2}); }

function pickTarget(){
  const pool = houses.filter(h => h !== target);
  target = pool[(rnd()*pool.length)|0];
}
pickTarget();

// ---------- physics ----------
function collide(){
  for (const s of solids) {
    const cx = Math.max(s.x, Math.min(P.x, s.x + s.w));
    const cy = Math.max(s.y, Math.min(P.y, s.y + s.h));
    const dx = P.x - cx, dy = P.y - cy;
    const d2 = dx*dx + dy*dy;
    if (d2 < P.r*P.r && d2 > 0) {
      const d = Math.sqrt(d2), push = P.r - d;
      const nx = dx/d, ny = dy/d;
      P.x += nx*push; P.y += ny*push;
      const dot = P.vx*nx + P.vy*ny;
      if (dot < 0) {
        const rest = 0.3 + up("bounce") * 0.22 + (P.zoom > 0 ? 0.35 : 0);
        P.vx -= (1+rest) * dot * nx; P.vy -= (1+rest) * dot * ny;
        if (rest > 0.7) burst(P.x, P.y, "BOING", "#9ef01a");
      }
    }
  }
}

function step(dt){
  // weather cycling
  wTimer -= dt; if (wTimer <= 0) { wIdx = (wIdx + 1) % WEATHERS.length; wTimer = WEATHERS[wIdx].dur; toast("Weather: " + WEATHERS[wIdx].name + " ☁"); }
  const W = WEATHERS[wIdx];
  windT += dt;
  wind.x = Math.sin(windT*0.7) * W.wind * (W.name === "Gust Festival" ? 2.5 : 1);
  wind.y = Math.cos(windT*0.45) * W.wind * 0.6;

  // input
  const acc = 0.32 * (1 + up("speed")*0.12) * (P.zoom > 0 ? 1.8 : 1);
  let ix = (keys.ArrowRight||keys.KeyD?1:0) - (keys.ArrowLeft||keys.KeyA?1:0);
  let iy = (keys.ArrowDown||keys.KeyS?1:0) - (keys.ArrowUp||keys.KeyW?1:0);
  if (ix || iy) { const l = Math.hypot(ix,iy); ix/=l; iy/=l; P.vx += ix*acc; P.vy += iy*acc; }
  // absurd: sled hops occasionally when zooming
  if (P.zoom > 0) { P.zoom -= dt; P.ang += dt * 14; }
  const fric = W.fric + up("grip")*0.004 - (P.zoom>0?0.01:0);
  const fluffMul = 1 - up("fluff")*0.05 * (W.fog > 0.2 ? 1 : 0);
  P.vx += wind.x * (1 - up("fluff")*0.1); P.vy += wind.y;
  P.vx *= fric * fluffMul; P.vy *= fric * fluffMul;
  const maxV = 6 + up("speed")*0.8 + (P.zoom>0?4:0);
  const sp = Math.hypot(P.vx, P.vy); if (sp > maxV) { P.vx *= maxV/sp; P.vy *= maxV/sp; }
  P.x += P.vx; P.y += P.vy;
  P.x = Math.max(20, Math.min(WORLD.w-20, P.x)); P.y = Math.max(20, Math.min(WORLD.h-20, P.y));
  collide();
  if (sp > 0.6) P.ang = Math.atan2(P.vy, P.vx);

  // deliveries
  if (target && P.carry > 0) {
    const d = Math.hypot(P.x - target.door.x, P.y - target.door.y);
    if (d < 70) {
      P.carry--;
      const reward = 12 + Math.round(Math.hypot(target.door.x - PO.x, target.door.y - PO.y)/60);
      money += reward;
      burst(target.door.x, target.door.y - 20, `+${reward} biscuits`, "#ffd166");
      toast(`${target.name}: "${QUOTES[(rnd()*QUOTES.length)|0]}"`, 3200);
      pickTarget();
    }
  }
  // pigeon theft (absurd whimsy)
  for (const p of pigeons) {
    p.t += dt; p.x += Math.cos(p.a)*0.5; p.y += Math.sin(p.a)*0.5;
    if (p.t > 4) { p.t = 0; p.a += (rnd()-0.5)*2; }
    if (P.carry > 0 && Math.hypot(p.x-P.x, p.y-P.y) < 30 && rnd() < 0.005) {
      P.carry--; burst(P.x, P.y-24, "PIGEON STOLE ONE!", "#f4a261"); toast("A pigeon snatched a parcel. Rude.");
    }
  }
  for (const c of cats) { c.t += dt; if (c.t > 3) { c.t = 0; c.dir += (rnd()-0.5)*2; } c.x += Math.cos(c.dir)*0.25; c.y += Math.sin(c.dir)*0.25; }

  // snow particles
  const sCount = W.snow;
  while (flakes.length < sCount) flakes.push({ x: Math.random()*VW, y: Math.random()*VH, s: 1+Math.random()*2 });
  if (flakes.length > sCount + 20) flakes.length = sCount;
  for (const f of flakes) { f.y += 1 + f.s*0.8 + Math.abs(wind.x)*40; f.x += wind.x*60 + Math.sin(f.y*0.02)*0.4; if (f.y > VH) { f.y = -5; f.x = Math.random()*VW; } }
  for (const b of bursts) b.t -= dt;
  bursts = bursts.filter(b => b.t > 0);
  if (toastT > 0) { toastT -= dt*1000; if (toastT <= 0) document.getElementById('toast').style.display = 'none'; }
  // HUD
  document.getElementById('money').textContent = "Biscuits: " + money;
  document.getElementById('carry').textContent = `Packages: ${P.carry}/${3+up("cargo")}`;
  document.getElementById('target').textContent = target ? `Deliver to: ${target.name}` : "—";
  document.getElementById('weather').textContent = "Weather: " + W.name;
}

// ---------- drawing ----------
let cam = { x: 0, y: 0 };
function drawWorld(W){
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, "#c9e6ff"); g.addColorStop(1, "#e9f5ff");
  ctx.fillStyle = "#e9f5ff";
  ctx.fillRect(0,0,VW,VH);
  ctx.save(); ctx.translate(-cam.x, -cam.y);
  // ground speckles
  ctx.fillStyle = "#f4fbff";
  ctx.fillRect(0,0,WORLD.w,WORLD.h);
  ctx.fillStyle = "rgba(120,160,200,.08)";
  for (let i=0;i<400;i++) ctx.fillRect((i*137)%WORLD.w, (i*311)%WORLD.h, 6, 6);
  // roads
  ctx.fillStyle = "#c8d6e5";
  ctx.fillRect(0, 760, WORLD.w, 90); ctx.fillRect(1120, 0, 90, WORLD.h);
  ctx.strokeStyle = "#ffffffaa"; ctx.setLineDash([18,14]); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,805); ctx.lineTo(WORLD.w,805); ctx.moveTo(1165,0); ctx.lineTo(1165,WORLD.h); ctx.stroke(); ctx.setLineDash([]);
  // post office
  ctx.fillStyle = "#d62828"; ctx.fillRect(PO.x-PO.w/2, PO.y-PO.h/2, PO.w, PO.h);
  ctx.fillStyle = "#fff"; ctx.font = "bold 22px Trebuchet MS"; ctx.textAlign="center";
  ctx.fillText("POST OFFICE", PO.x, PO.y+6);
  ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.moveTo(PO.x-PO.w/2-10,PO.y-PO.h/2); ctx.lineTo(PO.x, PO.y-PO.h/2-40); ctx.lineTo(PO.x+PO.w/2+10,PO.y-PO.h/2); ctx.fill();
  // trees
  for (const t of trees) { ctx.fillStyle="#2b9348"; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,6.3); ctx.fill(); ctx.fillStyle="#fff8"; ctx.beginPath(); ctx.arc(t.x-t.r*0.3,t.y-t.r*0.3,t.r*0.4,0,6.3); ctx.fill(); }
  // houses
  for (const h of houses) {
    ctx.fillStyle = "#00000022"; ctx.fillRect(h.x+6,h.y+8,h.w,h.h);
    ctx.fillStyle = h.color; ctx.fillRect(h.x,h.y,h.w,h.h);
    ctx.fillStyle = "#3d405b"; ctx.beginPath(); ctx.moveTo(h.x-10,h.y); ctx.lineTo(h.x+h.w/2,h.y-45); ctx.lineTo(h.x+h.w+10,h.y); ctx.fill();
    ctx.fillStyle = "#264653"; ctx.fillRect(h.x+h.w/2-12,h.y+h.h-30,24,30);
    ctx.fillStyle = "#ffe8a3"; ctx.fillRect(h.x+18,h.y+18,22,20); ctx.fillRect(h.x+h.w-40,h.y+18,22,20);
    // mailbox
    const isT = h === target;
    ctx.fillStyle = isT ? "#ff595e" : "#6c757d"; ctx.fillRect(h.door.x-6, h.door.y-16, 12, 16);
    if (isT) {
      const pulse = 4 + Math.sin(performance.now()/160)*3;
      ctx.strokeStyle="#ffd166"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(h.door.x, h.door.y-8, 26+pulse, 0, 6.3); ctx.stroke();
      ctx.fillStyle="#fff"; ctx.font="12px Trebuchet MS"; ctx.fillText(h.name, h.x+h.w/2, h.y-52);
    }
  }
  // cats and pigeons
  for (const c of cats) { ctx.fillStyle="#495057"; ctx.beginPath(); ctx.ellipse(c.x,c.y,9,6,0,0,6.3); ctx.fill(); ctx.beginPath(); ctx.arc(c.x+8,c.y-4,5,0,6.3); ctx.fill(); }
  for (const p of pigeons) { ctx.fillStyle="#6c757d"; ctx.beginPath(); ctx.ellipse(p.x,p.y,7,5,0,0,6.3); ctx.fill(); }
  // player
  drawHusky();
  // direction arrow toward target
  if (target) {
    const ang = Math.atan2(target.door.y - P.y, target.door.x - P.x);
    const dist = Math.hypot(target.door.x - P.x, target.door.y - P.y);
    if (dist > 90) {
      const bob = Math.sin(performance.now()/180) * 3;
      const ax = P.x + Math.cos(ang) * (44 + bob), ay = P.y + Math.sin(ang) * (44 + bob);
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
      ctx.fillStyle = "#ffd166"; ctx.strokeStyle = "#3d405b"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-6,-8); ctx.lineTo(-2,0); ctx.lineTo(-6,8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  // bursts
  ctx.textAlign="center"; ctx.font="bold 16px Trebuchet MS";
  for (const b of bursts) { ctx.globalAlpha = Math.min(1,b.t); ctx.fillStyle=b.col; ctx.fillText(b.txt, b.x, b.y - (1.2-b.t)*30); ctx.globalAlpha=1; }
  ctx.restore();
}
function drawHusky(){
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.ang + (P.zoom>0 ? Math.sin(performance.now()/40)*0.3 : 0));
  // sled
  ctx.fillStyle="#8d5524"; ctx.fillRect(-22,-9,44,6);
  ctx.fillStyle="#c68642"; ctx.fillRect(-18,-14,36,5);
  // tail
  ctx.strokeStyle="#e0e0e0"; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-10,0); ctx.quadraticCurveTo(-22,-10+Math.sin(performance.now()/120)*5,-16,-16); ctx.stroke();
  // body
  ctx.fillStyle="#7d8597"; ctx.beginPath(); ctx.ellipse(0,0,15,10,0,0,6.3); ctx.fill();
  ctx.fillStyle="#f8f9fa"; ctx.beginPath(); ctx.ellipse(4,3,10,6,0.3,0,6.3); ctx.fill();
  // head
  ctx.fillStyle="#7d8597"; ctx.beginPath(); ctx.arc(14,-4,8,0,6.3); ctx.fill();
  ctx.fillStyle="#f8f9fa"; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(22,-2); ctx.lineTo(14,4); ctx.fill();
  ctx.fillStyle="#333"; ctx.beginPath(); ctx.arc(16,-6,1.6,0,6.3); ctx.fill();
  ctx.fillStyle="#7d8597"; ctx.beginPath(); ctx.moveTo(9,-9); ctx.lineTo(10,-18); ctx.lineTo(14,-10); ctx.fill(); ctx.beginPath(); ctx.moveTo(15,-10); ctx.lineTo(19,-18); ctx.lineTo(20,-8); ctx.fill();
  ctx.restore();
  // packages on sled
  for (let i=0;i<P.carry;i++){
    const bob = Math.sin(performance.now()/200 + i) * 4;
    ctx.fillStyle="#b07d4a"; ctx.fillRect(P.x-14+i*7, P.y-22+bob, 10, 9);
    ctx.fillStyle="#ffd166"; ctx.fillRect(P.x-14+i*7+4, P.y-22+bob, 2, 9);
  }
}
function drawFx(){
  const W = WEATHERS[wIdx];
  if (W.rain) { ctx.strokeStyle="#9ecbff99"; ctx.lineWidth=1; for (let i=0;i<W.rain;i++){ const x=(i*97+performance.now()*0.5)%VW, y=(i*53+performance.now()*0.9)%VH; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-4,y+12); ctx.stroke(); } }
  ctx.fillStyle="#fff";
  for (const f of flakes) { ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(f.x,f.y,f.s,0,6.3); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (W.fog > 0) {
    const grd = ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.2, VW/2,VH/2,Math.max(VW,VH)*0.7);
    grd.addColorStop(0,"rgba(230,240,255,0)"); grd.addColorStop(1,`rgba(230,240,255,${W.fog})`);
    ctx.fillStyle = grd; ctx.fillRect(0,0,VW,VH);
  }
  if (P.zoom > 0) { ctx.fillStyle="rgba(255,209,102,.12)"; ctx.fillRect(0,0,VW,VH); }
}
function frame(t){
  const dt = Math.min(0.05, (t - (frame.last||t))/1000); frame.last = t;
  if (!shopOpen) step(dt);
  cam.x += (P.x - VW/2 - cam.x) * 0.12;
  cam.y += (P.y - VH/2 - cam.y) * 0.12;
  cam.x = Math.max(-100, Math.min(WORLD.w - VW + 100, cam.x));
  cam.y = Math.max(-100, Math.min(WORLD.h - VH + 100, cam.y));
  drawWorld();
  drawFx();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
